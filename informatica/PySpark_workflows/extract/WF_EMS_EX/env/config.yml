# =============================================================================
paths:
  input_base: "${INPUT_PATH:/tmp}"
  output_base: "${OUTPUT_PATH:/tmp}"
  staging: "${STAGING_PATH:/tmp}"
  archive: "${ARCHIVE_PATH:/tmp}"
  source_file_dir: "${PMSOURCE_FILE_DIR:/tmp}"  # Maps to Informatica $PMSourceFileDir

